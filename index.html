<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>City Runner</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

/* TOP UI */
#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
    z-index: 5;
}

.box {
    background: #0008;
    padding: 10px 14px;
    border-radius: 10px;
}

/* MENU */
#menu {
    position: fixed;
    inset: 0;
    background: #000b;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
}

#menu h1 {
    font-size: 52px;
    color: #00e5ff;
    text-shadow: 0 0 20px #00e5ff;
    margin-bottom: 15px;
}

#menu p {
    font-size: 18px;
    margin-bottom: 25px;
    padding: 0 20px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 15px 35px;
    background: #00a8ff;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

/* MOBILE CONTROLS */
#controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 6;
    pointer-events: none;
}

.group {
    display: flex;
    gap: 12px;
}

.control {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #0008;
    border: 2px solid white;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
}

.control:active {
    background: #00a8ff;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div class="box">⭐ <span id="score">0</span></div>
    <div class="box">🪙 <span id="coins">0</span></div>
    <div class="box">⚡ <span id="speed">1</span>x</div>
</div>

<div id="menu">
    <h1 id="title">CITY RUNNER</h1>

    <p id="message">
        Run, jump, collect coins and avoid trains!
    </p>

    <button id="start">START</button>
</div>

<div id="controls">

    <div class="group">
        <div class="control" id="left">◀</div>
        <div class="control" id="right">▶</div>
    </div>

    <div class="group">
        <div class="control" id="jump">▲</div>
        <div class="control" id="slide">▼</div>
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


/* =========================
   GAME VARIABLES
========================= */

let running = false;

let score = 0;
let coins = 0;

let gameSpeed = 7;

let roadOffset = 0;

let spawnTimer = 0;
let coinTimer = 0;


/* =========================
   PLAYER
========================= */

const player = {

    lane: 1,

    x: 0,

    y: 0,

    width: 42,

    height: 65,

    jump: 0,

    jumpVelocity: 0,

    sliding: false

};


/* =========================
   OBJECTS
========================= */

let objects = [];


/* =========================
   ROAD
========================= */

function roadInfo() {

    const roadW = Math.min(W * 0.72, 650);

    const left = (W - roadW) / 2;

    return {
        width: roadW,
        left: left
    };
}


/* =========================
   LANE POSITION
========================= */

function laneX(lane) {

    const road = roadInfo();

    const laneWidth = road.width / 3;

    return road.left +
           laneWidth * lane +
           laneWidth / 2;
}


/* =========================
   RESET GAME
========================= */

function reset() {

    score = 0;

    coins = 0;

    gameSpeed = 7;

    roadOffset = 0;

    objects = [];

    spawnTimer = 0;

    coinTimer = 0;

    player.lane = 1;

    player.jump = 0;

    player.jumpVelocity = 0;

    player.sliding = false;

    updateUI();
}


/* =========================
   START GAME
========================= */

function startGame() {

    reset();

    running = true;

    document.getElementById("menu").style.display = "none";

    requestAnimationFrame(gameLoop);
}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    running = false;

    document.getElementById("title").textContent =
        "GAME OVER";

    document.getElementById("message").textContent =
        "Score: " + score + "   Coins: " + coins;

    document.getElementById("start").textContent =
        "PLAY AGAIN";

    document.getElementById("menu").style.display =
        "flex";
}


/* =========================
   UPDATE UI
========================= */

function updateUI() {

    document.getElementById("score").textContent =
        score;

    document.getElementById("coins").textContent =
        coins;

    document.getElementById("speed").textContent =
        Math.max(1, Math.floor(gameSpeed / 7));
}


/* =========================
   MOVE LEFT
========================= */

function moveLeft() {

    if (!running) return;

    if (player.lane > 0) {
        player.lane--;
    }
}


/* =========================
   MOVE RIGHT
========================= */

function moveRight() {

    if (!running) return;

    if (player.lane < 2) {
        player.lane++;
    }
}


/* =========================
   JUMP
========================= */

function jump() {

    if (!running) return;

    if (player.jump === 0) {

        player.jump = 1;

        player.jumpVelocity = 16;
    }
}


/* =========================
   SLIDE
========================= */

function slideStart() {

    if (!running) return;

    player.sliding = true;
}


function slideEnd() {

    player.sliding = false;
}


/* =========================
   SPAWN OBSTACLE
========================= */

function spawnObstacle() {

    const lane =
        Math.floor(Math.random() * 3);

    objects.push({

        type: "obstacle",

        lane: lane,

        y: -100,

        width: 55,

        height: 70

    });
}


/* =========================
   SPAWN COIN
========================= */

function spawnCoin() {

    const lane =
        Math.floor(Math.random() * 3);

    objects.push({

        type: "coin",

        lane: lane,

        y: -50,

        width: 28,

        height: 28,

        rotation: 0

    });
}


/* =========================
   COLLISION
========================= */

function collision(a, b) {

    return (

        a.x - a.width / 2 <
        b.x + b.width / 2 &&

        a.x + a.width / 2 >
        b.x - b.width / 2 &&

        a.y - a.height <
        b.y + b.height / 2 &&

        a.y >
        b.y - b.height / 2

    );
}


/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer() {

    if (player.jump > 0) {

        player.jumpVelocity -= 0.8;

        player.y += player.jumpVelocity;

        if (player.y <= 0) {

            player.y = 0;

            player.jump = 0;

            player.jumpVelocity = 0;
        }
    }
}


/* =========================
   UPDATE OBJECTS
========================= */

function updateObjects() {

    for (let i = objects.length - 1; i >= 0; i--) {

        const obj = objects[i];

        obj.y += gameSpeed;

        if (obj.type === "coin") {

            obj.rotation += 0.1;
        }


        /* REMOVE OBJECT */

        if (obj.y > H + 100) {

            objects.splice(i, 1);

            continue;
        }


        /* OBJECT POSITION */

        const ox = laneX(obj.lane);

        const oy = obj.y;


        /* PLAYER POSITION */

        const px = laneX(player.lane);

        const py =
            H - 140 + player.y;


        /* COIN */

        if (obj.type === "coin") {

            const dx = px - ox;

            const dy = py - oy;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance < 45) {

                coins++;

                score += 10;

                objects.splice(i, 1);

                continue;
            }
        }


        /* OBSTACLE */

        if (obj.type === "obstacle") {

            const playerHeight =
                player.sliding ? 35 : 65;

            const playerBox = {

                x: px,

                y: py,

                width: player.width,

                height: playerHeight

            };

            const obstacleBox = {

                x: ox,

                y: oy,

                width: obj.width,

                height: obj.height

            };


            if (

                Math.abs(playerBox.x - obstacleBox.x)
                < 38 &&

                Math.abs(playerBox.y - obstacleBox.y)
                < 55

            ) {

                if (player.jump === 0) {

                    gameOver();

                    return;
                }
            }
        }
    }
}


/* =========================
   UPDATE GAME
========================= */

function update() {

    updatePlayer();

    updateObjects();

    roadOffset += gameSpeed;

    score++;

    /* Increase speed */

    gameSpeed += 0.002;


    /* Spawn obstacles */

    spawnTimer--;

    if (spawnTimer <= 0) {

        spawnObstacle();

        spawnTimer =
            Math.max(
                35,
                80 - gameSpeed * 3
            );
    }


    /* Spawn coins */

    coinTimer--;

    if (coinTimer <= 0) {

        spawnCoin();

        coinTimer = 45;
    }

    updateUI();
}


/* =========================
   DRAW SKY
========================= */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#081b3d"
    );

    gradient.addColorStop(
        1,
        "#36b9ff"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================
   DRAW BUILDINGS
========================= */

function drawBuildings() {

    const road =
        roadInfo();

    const buildingWidth = 55;

    for (
        let x = 0;
        x < W;
        x += buildingWidth
    ) {

        if (
            x >
            road.left - 20 &&
            x <
            road.left + road.width + 20
        ) {

            continue;
        }

        const index =
            Math.floor(x / buildingWidth);

        const height =
            100 +
            (index % 5) * 40;

        ctx.fillStyle =
            index % 2 === 0
                ? "#17213b"
                : "#202a45";

        ctx.fillRect(
            x,
            H - 260 - height,
            buildingWidth - 5,
            height
        );

        /* Windows */

        ctx.fillStyle = "#ffd54a";

        for (
            let wy =
                H - 240 - height;
            wy <
                H - 180;
            wy += 25
        ) {

            if (Math.random() > 0.25) {

                ctx.fillRect(
                    x + 10,
                    wy,
                    7,
                    10
                );
            }
        }
    }
}


/* =========================
   DRAW ROAD
========================= */

function drawRoad() {

    const road =
        roadInfo();

    /* Road */

    ctx.fillStyle =
        "#292929";

    ctx.fillRect(
        road.left,
        0,
        road.width,
        H
    );


    /* Road edges */

    ctx.fillStyle =
        "#eeeeee";

    ctx.fillRect(
        road.left,
        0,
        6,
        H
    );

    ctx.fillRect(
        road.left +
        road.width -
        6,
        0,
        6,
        H
    );


    /* Lane lines */

    const laneWidth =
        road.width / 3;

    ctx.fillStyle =
        "#ffffffaa";

    for (
        let lane = 1;
        lane < 3;
        lane++
    ) {

        const x =
            road.left +
            laneWidth * lane;

        for (
            let y =
                (roadOffset % 80) - 80;
            y < H;
            y += 80
        ) {

            ctx.fillRect(
                x - 3,
                y,
                6,
                40
            );
        }
    }
}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer() {

    const x =
        laneX(player.lane);

    const groundY =
        H - 140;

    const jumpY =
        groundY + player.y;

    let height =
        player.sliding ? 35 : 65;

    let width =
        player.sliding ? 60 : 42;


    /* Shadow */

    ctx.fillStyle =
        "#0008";

    ctx.beginPath();

    ctx.ellipse(
        x,
        groundY + 5,
        30,
        10,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Body */

    ctx.fillStyle =
        "#00e5ff";

    ctx.fillRect(
        x - width / 2,
        jumpY - height,
        width,
        height
    );


    /* Head */

    if (!player.sliding) {

        ctx.fillStyle =
            "#ffd1a9";

        ctx.beginPath();

        ctx.arc(
            x,
            jumpY - height - 13,
            14,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* Hair */

        ctx.fillStyle =
            "#151515";

        ctx.beginPath();

        ctx.arc(
            x,
            jumpY - height - 17,
            14,
            Math.PI,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* Shoes */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        x - 20,
        jumpY - 5,
        16,
        8
    );

    ctx.fillRect(
        x + 4,
        jumpY - 5,
        16,
        8
    );
}


/* =========================
   DRAW COIN
========================= */

function drawCoin(obj) {

    const x =
        laneX(obj.lane);

    const y =
        obj.y;

    const scale =
        Math.abs(
            Math.cos(obj.rotation)
        );

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        1
    );

    ctx.fillStyle =
        "#ffd700";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
        "#fff3a0";

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.fillStyle =
        "#b8860b";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "$",
        0,
        1
    );

    ctx.restore();
}


/* =========================
   DRAW OBSTACLE
========================= */

function drawObstacle(obj) {

    const x =
        laneX(obj.lane);

    const y =
        obj.y;

    /* Train */

    ctx.fillStyle =
        "#e53935";

    ctx.fillRect(
        x - 30,
        y - 35,
        60,
        70
    );


    /* Train top */

    ctx.fillStyle =
        "#b71c1c";

    ctx.fillRect(
        x - 25,
        y - 45,
        50,
        12
    );


    /* Windows */

    ctx.fillStyle =
        "#7eeaff";

    ctx.fillRect(
        x - 22,
        y - 25,
        16,
        16
    );

    ctx.fillRect(
        x + 6,
        y - 25,
        16,
        16
    );


    /* Lights */

    ctx.fillStyle =
        "#ffff00";

    ctx.beginPath();

    ctx.arc(
        x - 17,
        y + 23,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x + 17,
        y + 23,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================
   DRAW OBJECTS
========================= */

function drawObjects() {

    for (const obj of objects) {

        if (obj.type === "coin") {

            drawCoin(obj);

        } else {

            drawObstacle(obj);
        }
    }
}


/* =========================
   DRAW GAME
========================= */

function draw() {

    drawSky();

    drawBuildings();

    drawRoad();

    drawObjects();

    drawPlayer();
}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (!running) return;

    update();

    draw();

    requestAnimationFrame(gameLoop);
}


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a") {

            moveLeft();
        }

        if (event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d") {

            moveRight();
        }

        if (event.key === "ArrowUp" ||
            event.key === " ") {

            event.preventDefault();

            jump();
        }

        if (event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s") {

            slideStart();
        }
    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ) {

            slideEnd();
        }
    }
);


/* =========================
   MOBILE CONTROLS
========================= */

function buttonPress(
    id,
    action
) {

    const button =
        document.getElementById(id);

    button.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            action();
        }
    );
}


buttonPress(
    "left",
    moveLeft
);

buttonPress(
    "right",
    moveRight
);

buttonPress(
    "jump",
    jump
);


/* Slide */

const slideButton =
    document.getElementById("slide");

slideButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        slideStart();
    }
);

slideButton.addEventListener(
    "pointerup",
    function() {

        slideEnd();
    }
);

slideButton.addEventListener(
    "pointercancel",
    function() {

        slideEnd();
    }
);


/* =========================
   START BUTTON
========================= */

document.getElementById("start")
    .addEventListener(
        "click",
        startGame
    );


/* =========================
   INITIAL DRAW
========================= */

draw();

</script>

</body>
</html>
